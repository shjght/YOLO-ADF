# yolo11m_pure_transformer_optimized_v2.yaml
# exp02 优化版 - 标准 Attention + 1 层 + Dropout 0.1

nc: 10

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0
  - [-1, 1, Conv, [128, 3, 2]]                   # 1
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7
  # 改进：标准 Attention + 1 层 + Dropout 0.1
  # [c1, c2, num_heads, num_layers, dropout]
  # [1024, 1024, 8, 1, 0.1]
  - [-1, 1, TransformerBlock, [1024, 1024, 8, 1, 0.1]]  # 8  优化版
  - [-1, 2, C3k2, [1024, True]]                  # 9
  - [-1, 1, SPPF, [1024, 5]]                     # 10
  - [-1, 2, C2PSA, [1024]]                       # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 12
  - [[-1, 5], 1, Concat, [1]]                   # 13
  - [-1, 2, C3k2, [512, False]]                 # 14
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [[-1, 4], 1, Concat, [1]]                   # 16
  - [-1, 2, C3k2, [256, False]]                 # 17
  - [-1, 1, Conv, [256, 3, 2]]                  # 18
  - [[-1, 14], 1, Concat, [1]]                  # 19
  - [-1, 2, C3k2, [512, False]]                 # 20
  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 11], 1, Concat, [1]]                  # 22
  - [-1, 2, C3k2, [1024, False]]                # 23
  - [[17, 20, 23], 1, Detect, [nc]]             # 24
